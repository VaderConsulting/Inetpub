<script language="VBScript">

Function SendMail(EmailAddressTo, EmailAddressFrom, Subject, Message)
    Set objSendMail =     CreateObject("CDONTS.NewMail")
    objSendMail.From =    EmailAddressFrom
    objSendMail.To =      EmailAddressTo
    objSendMail.Subject = Subject
    objSendMail.Body =    Message
    objSendMail.Send
    Set objSendMail = Nothing
End Function

</script>
